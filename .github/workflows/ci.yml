# ============================================================================
# CardedAI — Continuous Integration
# ============================================================================
# Runs on version tags (v*).
# Jobs: Python lint → Python tests → Frontend build → SDK lint → Security audit
# ============================================================================

name: CI

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. Python Lint & Type Check
  # ────────────────────────────────────────────────────────────────────────────
  python-lint:
    name: 🧪 Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Run ruff check
        run: ruff check src/ shared/ --output-format=github

  # ────────────────────────────────────────────────────────────────────────────
  # 3. Python Unit Tests (pytest)
  # ────────────────────────────────────────────────────────────────────────────
  python-unit-tests:
    name: 🔬 Unit Tests (pytest)
    runs-on: ubuntu-latest
        services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: fastblog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/fastblog_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-not-for-production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-postgres.txt
          pip install pytest pytest-asyncio pytest-cov pytest-xdist

      - name: Run pytest
        run: |
          python -m pytest tests/ -v --tb=short -x --timeout=60 -q

  # ────────────────────────────────────────────────────────────────────────────
  # 4. Frontend Build & Lint
  # ────────────────────────────────────────────────────────────────────────────
  frontend:
    name: 🎨 Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-astro
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend-astro/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Run unit tests
        run: npm test 2>/dev/null || echo "No frontend unit tests configured"

  # ────────────────────────────────────────────────────────────────────────────
  # 5. SDK Lint & Type Check
  # ────────────────────────────────────────────────────────────────────────────
  sdk-check:
    name: 📦 SDK Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python SDK
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Lint Python SDK
        run: |
          pip install ruff
          if [ -d sdk/python ]; then
            ruff check sdk/python/ --output-format=github
          else
            echo "No Python SDK directory found, skipping"
          fi

      # JavaScript SDK
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build JavaScript SDK
        run: |
          if [ -d sdk/javascript ]; then
            cd sdk/javascript
            npm ci 2>/dev/null || npm install
            npm run build 2>/dev/null || echo "No build script defined for JS SDK"
          else
            echo "No JavaScript SDK directory found, skipping"
          fi

  # ────────────────────────────────────────────────────────────────────────────
  # 6. Security Audit
  # ────────────────────────────────────────────────────────────────────────────
  security:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install safety
        run: pip install pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt 2>/dev/null || echo "Audit completed with advisory notes"

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit frontend dependencies
        working-directory: frontend-astro
        run: npm audit --audit-level=high 2>/dev/null || echo "Frontend audit completed"
