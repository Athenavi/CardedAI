# FastBlog Nginx Configuration
# Production-ready reverse proxy configuration

upstream backend {
    server backend:9421;
    keepalive 32;
}

upstream frontend {
    server frontend:80;
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=50r/s;

server {
    listen 80;
    server_name _;

    # 真实客户端 IP
    # 本 nginx 作为边缘代理时 $remote_addr 已是客户端地址，无需 real_ip 模块。
    # 若前面还有 CDN / 云负载均衡，请解开下面两行并填其出口网段，
    # 否则 limit_req 会按 LB 的 IP 计数，等于把所有人算作同一个客户端。
    # set_real_ip_from 10.0.0.0/8;
    # real_ip_header X-Forwarded-For;

    # Security headers
    # 注意：HSTS 只在 HTTPS 响应上生效，当前 listen 80 下浏览器会忽略。
    # 若在此层终结 TLS 或前置 LB 已启用 HTTPS，请保留；否则建议删除以免误解。
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # Client settings
    client_max_body_size 60M;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # SSE / 流式接口：必须关闭缓冲，否则事件会被攒在 nginx 缓冲里，
    # 前端表现为"回复卡住不动，最后一次性出现"。
    # 更长的前缀优先于 /api/，因此这两个 location 会命中流式请求。
    location /api/v2/ai/mcp-chat/stream {
        limit_req zone=api burst=50 nodelay;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        # 流式响应可能长时间静默（等待 LLM），放宽读超时
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/v2/mcp/sse {
        limit_req zone=api burst=50 nodelay;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API endpoints
    location /api/ {
        limit_req zone=api burst=50 nodelay;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }

    # Auth endpoints (stricter rate limiting)
    location /api/v2/auth/ {
        limit_req zone=login burst=3 nodelay;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Swagger/API docs (生产环境限制内网访问)
    location /api/v2/docs {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v2/redoc {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v2/openapi.json {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Static files (backend)
    location /api/v2/static/ {
        proxy_pass http://backend;
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Assets storage
    # 注意：这里不能再强制下发 Cache-Control/expires。后端 MediaStaticFiles
    # 会对 HTML/SVG 等可执行内容强制 Content-Disposition: attachment 并标记
    # no-store，nginx 若覆盖成 "public, immutable" 会让浏览器长期缓存这些
    # 响应，绕过后端的下载策略。缓存策略完全交给后端决定。
    location /api/v2/assets/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # 不要启用 proxy_cache：媒体响应带 Set-Cookie/Authorization 语义，
        # 且 storage 内容会被覆盖写，缓存会导致用户拿到旧文件。
        proxy_buffering off;
    }

    # Media files
    location /media/ {
        proxy_pass http://backend;
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Frontend (catch-all)
    location / {
        limit_req zone=general burst=100 nodelay;

        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Health check endpoint
    location /health {
        access_log off;
        proxy_pass http://backend/api/v2/health;
    }

    # Favicon
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        proxy_pass http://frontend;
    }

    # Robots.txt
    location = /robots.txt {
        access_log off;
        log_not_found off;
        proxy_pass http://frontend;
    }

    # Sitemap
    location = /sitemap.xml {
        proxy_pass http://backend;
    }
}
